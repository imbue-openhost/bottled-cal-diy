worker_processes 1;
daemon off;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_max_body_size 10m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 10s;

    map $http_x_forwarded_host $upstream_host {
        default $host;
        ~^([^,\s]+) $1;
    }

    upstream calcom {
        server 127.0.0.1:3000;
    }

    upstream sso_sidecar {
        server 127.0.0.1:8090;
    }

    server {
        listen 443 ssl;
        ssl_certificate /data/app_data/cal-diy/self-cert/cert.pem;
        ssl_certificate_key /data/app_data/cal-diy/self-cert/key.pem;

        location / {
            proxy_pass http://calcom;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    server {
        listen 8080;

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location /_openhost/ {
            proxy_pass http://sso_sidecar;
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
            proxy_set_header Cookie $http_cookie;
        }

        location @sso_login {
            return 302 https://$upstream_host/_openhost/login;
        }

        location / {
            auth_request /_openhost_auth;
            error_page 401 = @sso_login;

            proxy_pass http://calcom;
            proxy_http_version 1.1;
            proxy_set_header Host $upstream_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $upstream_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;

            proxy_intercept_errors on;
            error_page 502 503 504 = @loading;
        }

        location = /_openhost_auth {
            internal;
            proxy_pass http://sso_sidecar/_openhost/auth_check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
            proxy_set_header Cookie $http_cookie;
        }

        location @loading {
            default_type text/html;
            return 200 '<html><head><meta http-equiv="refresh" content="5"></head><body><p>Cal.diy is starting, please wait...</p></body></html>';
        }
    }
}
